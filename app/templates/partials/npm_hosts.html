{% if hosts %}
{% for host in hosts %}
<div class="row">
  <span>{{ host.domain }}</span>
  <span class="status {{ 'ok' if host.enabled else 'error' }}">
    <span class="dot"></span>{{ "ONLINE" if host.enabled else "DISABLED" }}
  </span>
</div>
{% endfor %}
{% else %}
<p class="muted">Sin datos de Nginx Proxy Manager todav&iacute;a (configura NPM_BASE_URL / NPM_EMAIL / NPM_PASSWORD en .env).</p>
{% endif %}
