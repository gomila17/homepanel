{% if tunnel %}
<div class="row">
  <span>Estado</span>
  <span class="status {{ 'ok' if tunnel.healthy else 'error' }}">
    <span class="dot"></span>{{ tunnel.status }}
  </span>
</div>
<div class="row">
  <span>Conexiones activas</span>
  <span>{{ tunnel.connections }}</span>
</div>
<div class="row">
  <span>Rutas configuradas</span>
  <span>{{ tunnel.routes }}</span>
</div>
{% else %}
<p class="muted">Sin datos de Cloudflare Tunnel todav&iacute;a (configura CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_TUNNEL_ID en .env).</p>
{% endif %}
