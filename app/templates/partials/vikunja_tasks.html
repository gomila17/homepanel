{% if tasks %}
{% for task in tasks %}
<div class="task-row">
  <span class="task-row-main">
    <span class="dot-lead {{ task.urgency }}"></span>
    <span>
      <span class="task-name">{{ task.title }}</span>
      <span class="task-project">{{ task.project }}</span>
    </span>
  </span>
  <span class="task-due {{ task.urgency }}">{{ task.due_label }}</span>
</div>
{% endfor %}
{% else %}
<p class="muted">Sin datos de Vikunja todav&iacute;a (configura VIKUNJA_BASE_URL / VIKUNJA_API_TOKEN en .env).</p>
{% endif %}
