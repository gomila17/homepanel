{% if apps %}
<div class="app-grid">
  {% for app in apps %}
  <a href="{{ app.url }}" target="_blank" rel="noopener" class="app-card">
    <div class="app-card-top">
      <span class="app-name">{{ app.name }}</span>
      <span class="app-dot {{ 'ok' if app.online else 'error' }}"></span>
    </div>
    <div class="app-kind">{{ app.kind }}</div>
    <div class="app-card-bottom">
      <span class="app-status {{ 'ok' if app.online else 'error' }}">{{ "ONLINE" if app.online else "OFFLINE" }}</span>
      <span class="app-ms">{% if app.ms is not none %}{{ app.ms }} ms{% else %}&mdash;{% endif %}</span>
    </div>
  </a>
  {% endfor %}
</div>
{% else %}
<p class="muted">Sin aplicaciones configuradas (define {{ empty_hint }} en .env).</p>
{% endif %}
