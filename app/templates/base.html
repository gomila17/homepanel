<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}homepanel{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="console-header">
    <div class="header-brand">
      <span class="header-status-dot" style="background: var(--ok); box-shadow: 0 0 10px var(--ok)"></span>
      <div>
        <div class="brand-title">HOMELAB <span class="sep">//</span> OPERATIONS CONSOLE</div>
        <div class="brand-subtitle">PRIVATE INFRASTRUCTURE{% if location_label %} &middot; {{ location_label }}{% endif %}</div>
      </div>
    </div>

    <div class="header-status">
      <span class="header-label">SYSTEM STATUS</span>
      <span class="status-badge ok">
        <span class="dot"></span>NOMINAL
      </span>
    </div>

    <div class="header-stats">
      <div class="header-stat">
        <div class="header-label">NODE</div>
        <div class="stat-value">{{ node_name }}</div>
      </div>
      <div class="header-stat">
        <div class="header-label">SERVICES</div>
        <div class="stat-value">{{ services_configured }} / {{ services_total }} CONFIGURED</div>
      </div>
    </div>

    <div class="header-clock">
      <div>
        <div class="header-label" id="clock-date">&mdash;</div>
        <div class="clock-time" id="clock-time">--:--:--<span class="clock-tz" id="clock-tz">UTC</span></div>
      </div>
    </div>

    <div class="header-weather" id="weather" hx-get="/partials/weather" hx-trigger="load, every 600s">
      <div class="header-label">&mdash;</div>
      <div class="stat-value">Cargando&hellip;</div>
    </div>
  </header>
  {% block content %}{% endblock %}

  <script>
    const DAYS = ["DOM", "LUN", "MAR", "MIE", "JUE", "VIE", "SAB"];
    const MONTHS = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
    const pad = n => String(n).padStart(2, "0");

    function tickClock() {
      const t = new Date();
      document.getElementById("clock-time").firstChild.textContent =
        `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
      document.getElementById("clock-date").textContent =
        `${DAYS[t.getDay()]} ${pad(t.getDate())} ${MONTHS[t.getMonth()]} ${t.getFullYear()}`;
      const offsetMin = -t.getTimezoneOffset();
      document.getElementById("clock-tz").textContent =
        `UTC${offsetMin >= 0 ? "+" : "-"}${Math.abs(offsetMin / 60)}`;
    }

    tickClock();
    setInterval(tickClock, 1000);
  </script>
</body>
</html>
